<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Registro - Veterinaria San Marcos</title>
</head>
<body class="bg-light">
    <div class="container py-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>
    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <div class="text-center mb-4">
                        <img src="img/carrusel/logo/logo.jpg" alt="Logo" class="rounded-circle mb-2" width="60" height="60" style="object-fit: cover;">
                        <h3 class="fw-bold text-dark">Crear Cuenta</h3>
                        <p class="text-muted small">Ingresa tus datos para registrarte</p>
                    </div>
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Nombre completo</label>
                            <input type="text" class="form-control bg-light border-0 py-2" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Correo electrónico</label>
                            <input type="email" class="form-control bg-light border-0 py-2" placeholder="nombre@correo.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Teléfono</label>
                            <input type="tel" class="form-control bg-light border-0 py-2" placeholder="+56 9 1234 5678" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Contraseña</label>
                            <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mt-3 shadow-sm">
                            Registrarme
                        </button>
                    </form>
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">¿Ya tienes cuenta? 
                            <a href="login.html" class="fw-bold text-decoration-none">Inicia sesión aquí</a>
                        </p>
                    </div>
                    </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
